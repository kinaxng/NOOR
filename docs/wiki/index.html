<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="NOOR documentation wiki">
  <meta name="theme-color" content="#080a0e">
  <title>NOOR Wiki</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="./wiki.css">
</head>
<body>
  <div id="app">Loading NOOR Wiki…</div>
  <script>
    window.$docsify = {
      name: 'NOOR',
      repo: 'kinaxng/NOOR',
      homepage: 'Home.md',
      loadSidebar: true,
      loadFooter: true,
      auto2top: true,
      subMaxLevel: 2,
      search: { placeholder: '搜索文档', noData: '没有找到结果', depth: 4 },
      copyCode: { buttonText: '复制', errorText: '失败', successText: '已复制' }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
</body>
</html>
